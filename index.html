<body>
<div class="wrap">
<div class="hero"><video id="heroVid" src="assets/poster.mp4" poster="assets/poster.webp" muted loop playsinline autoplay aria-hidden="true"></video></div>
<header>
  <h1 id="title"></h1>
  <div class="lang" role="group" aria-label="Language">
    <button type="button" data-lang="en">EN</button>
    <button type="button" data-lang="de">DE</button>
  </div>
</header>
<p id="tagline" class="mute"></p>
<button type="button" class="btn sos noprint" id="sosBtn" aria-expanded="false" aria-controls="sos"></button>
<section id="sos" class="card sos-card" hidden></section>

<section class="card" id="intro"></section>

<form id="form" class="noprint" novalidate></form>
<section id="plan" aria-live="polite"></section>

<footer><p id="foot"></p><p><a href="https://github.com/michaelwartmann/cyber-quest">GitHub</a> · <a href="../">向日葵.世界</a></p></footer>
</div>

<script>
"use strict";
/* ---------- storage (local only) ---------- */
const KEY = "cybercheck-v1";
let st = { lang: null, ans: {}, done: {} };
try { const s = JSON.parse(localStorage.getItem(KEY) || "null"); if (s) st = Object.assign(st, s); } catch (e) {}
function save() { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {} }
if (!st.lang) st.lang = (navigator.language || "en").toLowerCase().startsWith("de") ? "de" : "en";
/* v3: several computers. Old single answer "pc" → list; its quests get the system in their id. */
(function migrate() {
  const a = st.ans || {};
  if (typeof a.pc !== "string") return;
  const os = a.pc; a.pc = [os];
  if (os !== "none") {
    if (a.pcUpd !== undefined) a["pcUpd_" + os] = a.pcUpd;
    if (a.enc !== undefined) a["enc_" + os] = a.enc;
    for (const k of ["done", "tick", "block", "extra"]) { const o = st[k]; if (!o) continue;
      for (const b of ["pcUpd", "enc"]) if (o[b] !== undefined) { o[b + "-" + os] = o[b]; delete o[b]; } }
  }
  delete a.pcUpd; delete a.enc; save();
})();
const t = o => (o && (o[st.lang] ?? o.en)) || "";
const L = (en, de) => ({ en, de });
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

/* ---------- texts ---------- */
const T = {
  title: L("Cyber check", "Cyber-Check"),
  tagline: L("Safe in cyberspace, now that AI can attack. About 20 questions, then your personal plan. Your answers stay on this phone.",
             "Sicher im Netz, jetzt wo KI angreifen kann. Etwa 20 Fragen, dann dein persönlicher Plan. Deine Antworten bleiben auf diesem Gerät."),
  sos: L("🆘 I think I've been hacked", "🆘 Ich glaube, ich wurde gehackt"),
  introH: L("Why now", "Warum jetzt"),
  intro: [
    L("AI agents can now scan for weak devices, try leaked passwords everywhere, write flawless phishing in your language and clone a voice from a short clip — automatically, cheaply, at scale.",
      "KI-Agenten suchen heute automatisch nach schwachen Geräten, probieren geleakte Passwörter überall aus, schreiben fehlerfreie Phishing-Mails in deiner Sprache und klonen eine Stimme aus einem kurzen Clip – billig und massenhaft."),
    L("The defence is mostly the old basics, done properly: updates, unique passwords, passkeys, backups, a router that's been looked at, and a family code word. The difference: now you can't skip them.",
      "Die Abwehr sind meist die alten Grundlagen, aber richtig gemacht: Updates, einzigartige Passwörter, Passkeys, Backups, ein durchgesehener Router und ein Familien-Codewort. Der Unterschied: Man kann sie nicht mehr auslassen.")
  ],
  go: L("Show my plan", "Meinen Plan zeigen"),
  planH: L("Your plan", "Dein Plan"),
  R: L("Today", "Heute"), A: L("This week", "Diese Woche"), G: L("Good", "Gut"),
  okH: L("Already good", "Schon gut"),
  progress: L("done", "erledigt"),
  markDone: L("Done", "Erledigt"),
  print: L("Print plan", "Plan drucken"),
  reset: L("Start over", "Neu anfangen"),
  resetQ: L("Tap again: delete all answers and ticks", "Nochmal tippen: alle Antworten und Häkchen löschen"),
  edit: L("Change answers", "Antworten ändern"),
  missing: L("Unanswered questions count as “don't know”.", "Unbeantwortete Fragen zählen als „weiß nicht“."),
  foot: L("Nov 2026. Based on BSI, Verbraucherzentrale, NCSC (UK) and FBI/FTC advice. No accounts, no tracking, nothing leaves your phone. MIT licence.",
          "Nov. 2026. Grundlage: Empfehlungen von BSI, Verbraucherzentrale, NCSC (UK) und FBI/FTC. Keine Konten, kein Tracking, nichts verlässt dein Gerät. MIT-Lizenz.")
};

const SOS = {
  h: L("If you think you've been hacked", "Wenn du glaubst, gehackt worden zu sein"),
  steps: [
    L("Breathe. Act in order, not in panic. Don't pay anyone and don't call numbers from the suspicious message.",
      "Durchatmen. Der Reihe nach handeln, nicht in Panik. Niemandem Geld zahlen, keine Nummern aus der verdächtigen Nachricht anrufen."),
    L("Money at risk? Call your bank now using the number on your card. In Germany you can block cards and online banking via 116 116.",
      "Geht es um Geld? Sofort die Bank anrufen – Nummer von der Karte nehmen. In Deutschland sperrt der Sperr-Notruf 116 116 Karten und Onlinebanking."),
    L("Device acting strange or you installed something on request? Switch it to flight mode / unplug the network. Don't use it for logins.",
      "Gerät verhält sich seltsam oder du hast auf Aufforderung etwas installiert? Flugmodus / Netzwerk trennen. Nicht mehr zum Einloggen benutzen."),
    L("From a different, clean device: change your email password first (email resets everything else), then sign out all other sessions and check the recovery phone/email haven't been changed.",
      "Von einem anderen, sauberen Gerät: zuerst das E-Mail-Passwort ändern (über die E-Mail lässt sich alles andere zurücksetzen), dann alle anderen Sitzungen abmelden und prüfen, ob Wiederherstellungs-Nummer/-Adresse geändert wurden."),
    L("Then the same for bank, Apple/Google/Microsoft account, phone carrier, social media, shopping — and every place where you used the same password.",
      "Dann dasselbe für Bank, Apple/Google/Microsoft-Konto, Mobilfunkanbieter, soziale Netzwerke, Shopping – und überall, wo dasselbe Passwort benutzt wurde."),
    L("Take screenshots, note times. Report it: in Germany to the police online watch (Onlinewache of your state); elsewhere your national police/fraud reporting.",
      "Screenshots machen, Uhrzeiten notieren. Anzeige erstatten: in Deutschland über die Onlinewache der Polizei deines Bundeslandes."),
    L("Warn your contacts if your account sent messages. Then, calmly, come back here and do the plan.",

/* ---------- actions ---------- */
function plan(a) {
  const out = [];
  const add = (id, p, sec, title, why, steps) => out.push({ id, p, sec, title, why, steps });
  const ph = a.phone, pcl = pcs(a);

  /* phone updates */
  if (ph && ph !== "none") {
    const updSteps = ph === "ios"
      ? [L("Settings → General → Software Update → Automatic Updates: turn everything on, including “Security Responses”.", "Einstellungen → Allgemein → Softwareupdate → Automatische Updates: alles einschalten, auch „Sicherheitsmaßnahmen“."),
         L("Install any update that is waiting now.", "Wartendes Update jetzt installieren."),
         L("Settings → App Store → App Updates: on.", "Einstellungen → App Store → App-Updates: ein.")]
      : [L("Settings → search “Software update” → install what's waiting; turn on automatic download.", "Einstellungen → nach „Software-Update“ suchen → Wartendes installieren; automatischen Download einschalten."),
         L("Settings → Security & privacy → Updates: also install the “Google Play system update”.", "Einstellungen → Sicherheit & Datenschutz → Updates: auch das „Google Play-Systemupdate“ installieren."),
         L("Play Store → profile → Settings → Network preferences → Auto-update apps: on.", "Play Store → Profil → Einstellungen → Netzwerkeinstellungen → Apps automatisch aktualisieren: ein."),
         L("Look up your model's update end date on the maker's website (Samsung, Google, Xiaomi …).", "Auf der Herstellerseite nachsehen, bis wann dein Modell Updates bekommt (Samsung, Google, Xiaomi …).")];
    if (a.phoneUpd === "old")
      add("phoneOld", "r", "dev", L("Your phone no longer gets security fixes", "Dein Handy bekommt keine Sicherheitsupdates mehr"),
        L("AI tools turn published flaws into working attacks within days. An unpatched phone stays open forever.", "KI-Werkzeuge machen aus veröffentlichten Lücken binnen Tagen fertige Angriffe. Ein ungepatchtes Handy bleibt für immer offen."),
        [L("Plan a replacement. A used or refurbished model with several years of guaranteed updates is fine.", "Ersatz planen. Ein gebrauchtes oder generalüberholtes Modell mit noch mehreren Jahren Update-Garantie reicht."),
         L("Until then: no banking, no password manager, no work email on this phone.", "Bis dahin: kein Banking, kein Passwort-Manager, keine Arbeits-Mails auf diesem Handy."),
         L("When you switch: reset the old phone to factory settings before giving it away.", "Beim Wechsel: altes Handy auf Werkseinstellungen zurücksetzen, bevor du es weitergibst.")]);
    else
      add("phoneUpd", a.phoneUpd === "ok" ? "g" : "r", "dev", L("Automatic updates on the phone", "Automatische Updates auf dem Handy"),
        L("Most real attacks use holes that are already fixed. Updates close them.", "Die meisten echten Angriffe nutzen Lücken, die längst geschlossen sind. Updates schließen sie."), updSteps);

    add("theft", "a", "dev", L("Theft protection and Find my phone", "Diebstahlschutz und Handy-Ortung"),
      L("A stolen, unlocked phone opens your email, bank and passwords.", "Ein gestohlenes, entsperrtes Handy öffnet E-Mail, Bank und Passwörter."),
      ph === "ios"
        ? [L("Settings → Face ID & Passcode → Stolen Device Protection: on.", "Einstellungen → Face ID & Code → Schutz für gestohlene Geräte: ein."),
           L("Settings → your name → Find My → Find My iPhone: on.", "Einstellungen → dein Name → Wo ist? → Mein iPhone suchen: ein.")]
        : [L("Settings → search “Theft protection” → turn on theft detection and offline device lock.", "Einstellungen → nach „Diebstahlschutz“ suchen → Diebstahlerkennung und Offline-Gerätesperre einschalten."),
           L("Settings → search “Find My Device” → on.", "Einstellungen → nach „Mein Gerät finden“ suchen → ein.")]);

    add("lock", a.lock === "strong" ? "g" : "r", "dev", L("A real screen lock", "Eine echte Bildschirmsperre"),
      L("4 digits or a pattern can be watched over your shoulder or guessed.", "4 Ziffern oder ein Muster werden beobachtet oder erraten."),
      [L(ph === "ios" ? "Settings → Face ID & Passcode → Change Passcode → Passcode Options: 6-digit or longer." : "Settings → Security → Screen lock: PIN with 6+ digits or a password.",
         ph === "ios" ? "Einstellungen → Face ID & Code → Code ändern → Codeoptionen: 6 Ziffern oder länger." : "Einstellungen → Sicherheit → Displaysperre: PIN mit 6+ Ziffern oder Passwort."),
       L("Fingerprint or face unlock on top is fine and convenient.", "Fingerabdruck oder Gesicht zusätzlich ist in Ordnung und bequem."),
       L("Hide message contents on the lock screen.", "Nachrichteninhalte auf dem Sperrbildschirm ausblenden.")]);

    add("apps", a.apps === "store" ? "g" : "a", "dev", L("Clean up apps and permissions", "Apps und Berechtigungen aufräumen"),
      L("Fake apps are the easiest way onto a phone. Every unused app is an open door.", "Gefälschte Apps sind der einfachste Weg aufs Handy. Jede ungenutzte App ist eine offene Tür."),
      [L("Delete apps you haven't used for months.", "Apps löschen, die du seit Monaten nicht benutzt hast."),
       ph === "ios"
         ? L("Settings → Privacy & Security: check who has location, contacts, microphone, camera, photos.", "Einstellungen → Datenschutz & Sicherheit: prüfen, wer Standort, Kontakte, Mikrofon, Kamera, Fotos darf.")
         : L("Settings → Security & privacy → Privacy → Permission manager: check location, contacts, microphone, camera, SMS.", "Einstellungen → Sicherheit & Datenschutz → Datenschutz → Berechtigungsmanager: Standort, Kontakte, Mikrofon, Kamera, SMS prüfen."),
       ph === "android"
         ? L("Play Store → profile → Play Protect: on, and scan. Settings → search “Install unknown apps”: allow for none.", "Play Store → Profil → Play Protect: ein, und scannen. Einstellungen → „Unbekannte Apps installieren“ suchen: für keine erlauben.")
         : L("Only install from the App Store. Never install a “profile” or app because a message or caller asks you to.", "Nur aus dem App Store installieren. Nie ein „Profil“ oder eine App installieren, weil eine Nachricht oder ein Anrufer das will."),
       L("Never install remote-control apps (AnyDesk, TeamViewer …) for a caller. Real support doesn't call you.", "Nie Fernwartungs-Apps (AnyDesk, TeamViewer …) für einen Anrufer installieren. Echter Support ruft nicht an.")]);
  }

  /* computers: one updates quest and one encryption quest per system */
  for (const pc of pcs(a)) {
    const S = {
      win11: [L("Settings → Windows Update: install everything; turn on “Get the latest updates as soon as they're available”.", "Einstellungen → Windows Update: alles installieren; „Die neuesten Updates erhalten, sobald sie verfügbar sind“ einschalten."),
              L("Windows Security → Firewall & network protection: all three networks “on”. Virus & threat protection: on.", "Windows-Sicherheit → Firewall- & Netzwerkschutz: alle drei Netzwerke „ein“. Viren- & Bedrohungsschutz: ein."),
              L("Windows Security → App & browser control → Reputation-based protection: on.", "Windows-Sicherheit → App- & Browsersteuerung → Zuverlässigkeitsbasierter Schutz: ein.")],
      win10: [L("Windows 10 itself is out of support. Free security updates (ESU) run until 12 Oct 2027 — but only if you enrol.", "Windows 10 wird nicht mehr unterstützt. Kostenlose Sicherheitsupdates (ESU) gibt es bis 12.10.2027 – aber nur nach Anmeldung."),
              L("Settings → Update & Security → Windows Update → “Enroll now” for Extended Security Updates (sign in with a Microsoft account if asked).", "Einstellungen → Update und Sicherheit → Windows Update → „Jetzt registrieren“ für erweiterte Sicherheitsupdates (ggf. mit Microsoft-Konto anmelden)."),
              L("Install all waiting updates. Windows Security → Firewall: on.", "Alle wartenden Updates installieren. Windows-Sicherheit → Firewall: ein."),
              L("Plan the move before Oct 2027: Windows 11 if the PC supports it, otherwise Linux (e.g. Linux Mint, Ubuntu) or a new device.", "Wechsel vor Okt. 2027 planen: Windows 11, wenn der PC es kann, sonst Linux (z. B. Linux Mint, Ubuntu) oder ein neues Gerät.")],
      mac:   [L("System Settings → General → Software Update → (i) Automatic updates: turn all on, including “Install Security Responses and system files”.", "Systemeinstellungen → Allgemein → Softwareupdate → (i) Automatische Updates: alles ein, auch „Sicherheitsmaßnahmen und Systemdateien installieren“."),
              L("System Settings → Network → Firewall: on.", "Systemeinstellungen → Netzwerk → Firewall: ein."),
              L("Check the macOS version still gets updates; Apple usually supports the latest three.", "Prüfen, ob die macOS-Version noch Updates bekommt; Apple unterstützt meist die neuesten drei.")],
      linux: [L("Ubuntu: Software & Updates → Updates → security updates “Download and install automatically” (unattended-upgrades).", "Ubuntu: Anwendungen & Aktualisierungen → Aktualisierungen → Sicherheitsaktualisierungen „Automatisch herunterladen und installieren“ (unattended-upgrades)."),
              L("Firewall: run <code>sudo ufw enable</code>, then <code>sudo ufw status</code>.", "Firewall: <code>sudo ufw enable</code> ausführen, dann <code>sudo ufw status</code>."),
              L("Remove services you don't use (e.g. SSH server). Update Flatpak/Snap apps too.", "Dienste entfernen, die du nicht brauchst (z. B. SSH-Server). Auch Flatpak/Snap-Apps aktualisieren."),
              L("Check your release is still supported (e.g. Ubuntu LTS).", "Prüfen, ob deine Version noch unterstützt wird (z. B. Ubuntu LTS).")],
      chrome:[L("Updates are automatic: restart when it asks.", "Updates kommen automatisch: neu starten, wenn er fragt."),
              L("Settings → About ChromeOS → Additional details → Update schedule: check the end date.", "Einstellungen → Über ChromeOS → Weitere Details → Update-Zeitplan: Enddatum prüfen.")]
    }[pc];
    const pr = pc === "win10" ? "r" : (a["pcUpd_" + pc] === "ok" ? "g" : "r");
    add("pcUpd-" + pc, pr, "dev", pc === "win10" ? L("Windows 10: get the extra security updates, plan the move", "Windows 10: Zusatz-Sicherheitsupdates holen, Wechsel planen") : L(`${OSN[pc]}: updates and firewall`, `${OSN[pc]}: Updates und Firewall`),
      L("Agents scan the internet for unpatched machines around the clock.", "Agenten durchsuchen das Netz rund um die Uhr nach ungepatchten Rechnern."), S);
    if (pc !== "chrome")
      add("enc-" + pc, a["enc_" + pc] === "yes" ? "g" : "a", "dev", L(`${OSN[pc]}: encrypt the disk`, `${OSN[pc]}: Festplatte verschlüsseln`),
        L("If the laptop is stolen, an encrypted disk is just noise to the thief.", "Wird der Laptop gestohlen, ist eine verschlüsselte Platte für den Dieb nur Datenmüll."),
        {
          win11: [L("Settings → Privacy & security → Device encryption (Home) or search “BitLocker” (Pro): turn on.", "Einstellungen → Datenschutz & Sicherheit → Geräteverschlüsselung (Home) oder „BitLocker“ suchen (Pro): einschalten."),
                  L("Save the recovery key (it's in your Microsoft account; also print it and keep it safe).", "Wiederherstellungsschlüssel sichern (liegt im Microsoft-Konto; zusätzlich ausdrucken und sicher aufbewahren).")],
          win10: [L("Search “BitLocker” or “Device encryption” in Settings and turn it on; save the recovery key on paper.", "In den Einstellungen „BitLocker“ oder „Geräteverschlüsselung“ suchen und einschalten; Wiederherstellungsschlüssel auf Papier sichern.")],
          mac:   [L("System Settings → Privacy & Security → FileVault: turn on. Note the recovery key on paper.", "Systemeinstellungen → Datenschutz & Sicherheit → FileVault: einschalten. Wiederherstellungsschlüssel auf Papier notieren.")],
          linux: [L("Check first: run <code>lsblk -f</code> and look for <code>crypto_LUKS</code>. If it's there, tick everything – you're done.", "Erst prüfen: <code>lsblk -f</code> ausführen und nach <code>crypto_LUKS</code> suchen. Steht es da: alles abhaken, fertig."),
                  L("If not: on Linux this means a reinstall, not a setting. Plan it as a project with a date (use “Can't finish now” below).", "Falls nicht: Unter Linux heißt das Neuinstallation, keine Einstellung. Als Projekt mit Termin planen (unten „Geht gerade nicht“)."),
                  L("Prepare: full backup of your home folder to an external drive, and test that the files open.", "Vorbereiten: komplettes Backup des Home-Ordners auf eine externe Platte, und testen, ob die Dateien aufgehen."),
                  L("Dual boot with Windows? The installer's simple “encrypt” option wipes the whole disk. Work out your exact setup first (an AI can help, with the <code>lsblk -f</code> output).", "Dual-Boot mit Windows? Die einfache „Verschlüsseln“-Option des Installers löscht die ganze Platte. Erst den genauen Aufbau klären (eine KI hilft, mit der Ausgabe von <code>lsblk -f</code>)."),
                  L("Reinstall with “LVM and encryption”; write the passphrase on paper. Then restore the backup.", "Neu installieren mit „LVM und Verschlüsselung“; Passphrase auf Papier schreiben. Dann Backup zurückspielen."),
                  L("Encrypt the external backup drive too (Disks → format with LUKS).", "Die externe Backup-Platte auch verschlüsseln (Laufwerke → mit LUKS formatieren).")]
        }[pc]);
  }
  if (pcs(a).length)
  add("browser", "a", "dev", L("Browser: updated, few extensions", "Browser: aktuell, wenige Erweiterungen"),
      L("Extensions can read everything you see, including bank pages. Some are sold to criminals.", "Erweiterungen können alles lesen, was du siehst, auch Bankseiten. Manche werden an Kriminelle verkauft."),
      [L("Open the browser's menu → Extensions/Add-ons: remove all you don't really need.", "Browser-Menü → Erweiterungen/Add-ons: alle entfernen, die du nicht wirklich brauchst."),

    $("pending").outerHTML = `<div class="ai">${esc(ans)}</div>`;
  } catch (e) {
    chat.pop(); $("pending").outerHTML = `<div class="note">${esc(t(T.chatErr))}</div>`;
  }
}

/* ---------- events ---------- */
form.addEventListener("change", e => {
  const tg = e.target, nm = tg.name;
  if (tg.type === "radio") st.ans[nm] = tg.value;
  else if (tg.type === "checkbox") {
    if (tg.checked && tg.dataset.only1) form.querySelectorAll(`input[name="${nm}"]`).forEach(b => { if (b !== tg) b.checked = false; });
    if (tg.checked && !tg.dataset.only1) form.querySelectorAll(`input[name="${nm}"][data-only1]`).forEach(b => b.checked = false);
    st.ans[nm] = [...form.querySelectorAll(`input[name="${nm}"]:checked`)].map(b => b.value);
  } else return;
  save();
  const y = window.scrollY;
  renderForm(); window.scrollTo(0, y);
  const el = form.querySelector(`input[name="${nm}"][value="${tg.value}"]`); if (el) el.focus({ preventScroll: true });
  if (st.shown) renderGame(false);
});
form.addEventListener("submit", e => { e.preventDefault(); st.tab = "quests"; st.editing = false; form.hidden = true; intro.hidden = true; renderGame(); });
planEl.addEventListener("click", e => {
  const b = e.target.closest("button,a"); if (!b) return;
  const d = b.dataset;
  if (d.tab) { st.tab = d.tab; flash = {}; save(); renderGame(false); planEl.querySelector(`[data-tab="${d.tab}"]`).focus(); return; }
  if (d.bk) {
    if (st.tab !== "quests") { st.tab = "quests"; flash = {}; save(); renderGame(false); }
    const hh = $("bk-" + d.bk); if (hh) { hh.scrollIntoView({ block: "start" }); hh.focus({ preventScroll: true }); }
    return;
  }
  if (d.recheck || d.cup) { st.tab = "log"; flash = flash.checkup && d.cup ? {} : { checkup: 1 }; save(); renderGame(false); const c = $("cupTxt") || $("upkeep"); c.scrollIntoView({ block: "center" }); c.focus({ preventScroll: true }); return; }
  if (d.checkdone) { st.nextCheck = plusDays(today(), 90); save(); renderGame(false); return; }
  if (d.ics) { const dt = $("ncDate").value || plusDays(today(), 90); st.nextCheck = dt; save();
    const u = URL.createObjectURL(new Blob([icsFile(dt)], { type: "text/calendar" })), a = document.createElement("a");
    a.href = u; a.download = "cyber-quest-check-up.ics"; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(u), 4000); return; }
  if (d.mvlink) { copyText(location.href.split("#")[0] + "#load=" + encodeURIComponent(exportCode()), b); return; }
  if (d.mvcode) { copyText(exportCode(), b); return; }
  if (d.mvload) { const ok = importCode($("mvIn").value); $("mvMsg").textContent = t(ok ? T.mvOk : T.mvBad); if (ok) setTimeout(() => { render(); }, 500); return; }
  if (d.print) { st.tab = "quests"; flash = {}; save(); renderGame(false); setTimeout(() => window.print(), 50); return; }
  if (d.ai) { const id = d.ai; keepOpen(() => { flash = flash[id] === "ai" ? {} : { [id]: "ai" }; }, flash[id] === "ai" ? `[data-ai="${id}"]` : `#ap-${id}`); return; }
  if (d.nai) { openCard(d.nai, "ai", `#ap-${d.nai}`); return; }
  if (d.open) { openCard(d.open); return; }
  if (d.nblk) { openCard(d.nblk, "blk", `input[name="br-${d.nblk}"]`); return; }
  if (d.onemore) { moreOk = true; renderGame(false); const n = planEl.querySelector(".next h2"); if (n) { n.tabIndex = -1; n.focus(); } return; }
  if (d.ntick || d.ntickx) {
    const [id, k] = (d.ntick || d.ntickx).split(":"), x = plan(st.ans).find(q => q.id === id);
    if (d.ntick) (st.tick[id] = st.tick[id] || {})[k] = true; else st.extra[id][+k].d = true;
    flash = {}; const p = prog(x); if (p.d === p.n) finish(id); save();
    renderGame(false);
    if (st.done[id]) openCard(id, "foiled"); else { const n = planEl.querySelector(".next h2"); if (n) { n.tabIndex = -1; n.focus({ preventScroll: true }); } }
    return;
  }
  if (d.aihere) { const x = plan(st.ans).find(q => q.id === d.aihere), tk = st.tick[x.id] || {}; st.tab = "log"; chat = []; flash = {}; save(); renderGame(false);
    $("chatIn").value = questPrompt(x, x.steps.findIndex((_, k) => !tk[k]), false); $("chatIn").scrollIntoView({ block: "center" }); $("chatSend").focus({ preventScroll: true }); return; }
  if (d.fail) { keepOpen(() => { flash = { [d.fail]: "fail" }; }, `[data-fail="${d.fail}"]`); return; }
  if (d.stuck) { keepOpen(() => { flash = { [d.stuck]: "stuck" }; }, `#sp-${d.stuck}`); return; }
  if (d.undo) {
    keepOpen(() => {
      delete st.done[d.undo];
      const tk = st.tick[d.undo] || {}; const ks = Object.keys(tk).filter(k => tk[k]).map(Number).sort((a, c) => c - a);
      if (ks.length) delete tk[ks[0]];
      flash = {}; save();
    }, `details[data-id="${d.undo}"] summary`);
    return;
  }
  if (d.alldone || d.verify) { const id = d.alldone || d.verify; keepOpen(() => finish(id), `details[data-id="${id}"] summary`); return; }
  if (d.blk) { keepOpen(() => { flash = { [d.blk]: "blk" }; }, `input[name="br-${d.blk}"]`); return; }
  if (d.blkcancel) { keepOpen(() => { flash = {}; }, `details[data-id="${d.blkcancel}"] summary`); return; }
  if (d.blksave) {
    const id = d.blksave, r = planEl.querySelector(`input[name="br-${id}"]:checked`);
    const note = $("bn-" + id).value.trim(), date = $("bd-" + id).value;
    keepOpen(() => { st.block[id] = { r: r ? r.value : (note ? "wait" : "how"), note, date }; flash = {}; save(); }, `details[data-id="${id}"] summary`);
    return;
  }
  if (d.unblock) { keepOpen(() => { delete st.block[d.unblock]; flash = {}; save(); }, `details[data-id="${d.unblock}"] summary`); return; }
  if (d.addx) { addOwn(d.addx); return; }
  if (d.delx) { const [id, k] = d.delx.split(":"); keepOpen(() => { st.extra[id].splice(+k, 1); save(); }, `#ax-${id}`); return; }
  if (d.q) {
    const q = TRICKS.find(x => x.id === d.q);
    st.quiz[q.id] = { a: d.a, right: (d.a === "real") === q.real }; save();
    renderGame(false); const c = planEl.querySelectorAll(".card")[TRICKS.indexOf(q) + 1]; if (c) { const s2 = c.querySelector("[role=status]"); if (s2) { s2.tabIndex = -1; s2.focus(); } }
    return;
  }
  if (d.copy) { copyText($(d.copy).value, b); return; }
  if (b.id === "finBtn") { showFinale(); return; }
  if (b.id === "chatSend") { sendChat(); return; }
  if (b.id === "forgetKey") { st.key = ""; save(); $("orKey").value = ""; return; }
  if (b.id === "editBtn") { st.editing = true; save(); form.hidden = false; intro.hidden = false; form.scrollIntoView({ block: "start" }); const f1 = form.querySelector("input"); if (f1) f1.focus({ preventScroll: true }); return; }
  if (b.id === "resetBtn" && !b.dataset.armed) { b.dataset.armed = "1"; b.textContent = t(T.resetQ); return; }
  if (b.id === "resetBtn") { st = { lang: st.lang, ans: {}, done: {}, steps: {}, tick: {}, block: {}, extra: {}, v2: true, quiz: {}, bot: "Bit", tab: "quests", model: st.model, key: st.key }; chat = []; flash = {}; save(); render(); window.scrollTo(0, 0); }
});
function addOwn(id) {
  const inp = $("ax-" + id), v = inp.value.trim(); if (!v) return;
  keepOpen(() => { (st.extra[id] = st.extra[id] || []).push({ t: v, d: false }); delete st.done[id]; flash = {}; save(); }, `#ax-${id}`);
}
planEl.addEventListener("keydown", e => { if (e.key === "Enter" && e.target.dataset.axin) { e.preventDefault(); addOwn(e.target.dataset.axin); } });
planEl.addEventListener("change", e => {
  if (e.target.id === "ncDate") { if (e.target.value) { st.nextCheck = e.target.value; save(); } return; }
  const v = e.target.dataset.tick, vx = e.target.dataset.tickx;
  if (!v && !vx) return;
  const [id, k] = (v || vx).split(":"), on = e.target.checked;
  const x = plan(st.ans).find(q => q.id === id);
  keepOpen(() => {
    if (v) { const tk = st.tick[id] = st.tick[id] || {}; if (on) tk[k] = true; else delete tk[k]; }
    else st.extra[id][+k].d = on;
    flash = {};
    if (!on) delete st.done[id];
    const p = prog(x);
    if (on && p.d === p.n) finish(id);
    save();
  }, `[data-${v ? "tick" : "tickx"}="${v || vx}"]`);
});
planEl.addEventListener("input", e => {
  if (e.target.id === "botname") { st.bot = e.target.value.trim() || "Bit"; save(); }
});
planEl.addEventListener("focusout", e => { if (e.target.id === "botname") { const sv = planEl.querySelector(".hq svg"); if (sv) sv.setAttribute("aria-label", st.bot); } });
sosBtn.addEventListener("click", () => { const open = sos.hidden; sos.hidden = !open; sosBtn.setAttribute("aria-expanded", String(open)); if (open) sos.scrollIntoView({ block: "nearest" }); });
document.querySelectorAll(".lang button").forEach(b => b.addEventListener("click", () => { st.lang = b.dataset.lang; flash = {}; save(); render(); }));
render();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
